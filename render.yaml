# ==========================================
# CondoFlow - Render Blueprint Deployment
# ==========================================
databases:
  - name: condoflow-db
    databaseName: condoflow_prod
    user: condoflow_user
    plan: free

services:
  # Backend API (Django + Gunicorn)
  - type: web
    name: condoflow-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: condoflow-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # Frontend SPA (Angular)
  - type: web
    name: condoflow-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm ci && npm run build -- --configuration production"
    staticPublishPath: dist/condoflow-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
