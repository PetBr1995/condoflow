server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression para alta velocidade
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript font/woff font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # Cache de assets estáticos com hash no nome
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Redirecionamento SPA (HTML5 PushState Routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tratamento de erro 404 redirecionando para a raiz do Angular
    error_page 404 /index.html;
}
